name: Deploy Frontend

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e

            echo "🚀 Starting frontend deployment..."

            # 1️⃣ Pull frontend source code
            cd /root/finvypay/frontend

            echo "🔄 Fetching latest frontend code..."
            git fetch origin master
            git reset --hard origin/master

            # 2️⃣ Run docker from deployment directory
            cd /root/finvypay/deployment

            echo "🐳 Building frontend container..."
            docker-compose -f docker-compose.prod.yml build frontend

            echo "🚀 Starting frontend container..."
            docker-compose -f docker-compose.prod.yml up -d frontend

            echo "🔁 Restarting nginx..."
            docker-compose -f docker-compose.prod.yml restart nginx

            # 3️⃣ Health check
            echo "⏳ Waiting for frontend..."
            sleep 5

            echo "🧪 Health check..."
            curl -f https://api.finvypay.com || echo "⚠️ Frontend not responding yet"

            echo "📊 Service status:"
            docker-compose -f docker-compose.prod.yml ps

            echo "✅ Frontend deployment completed successfully"
